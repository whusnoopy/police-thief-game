<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>斜视素材检查</title>
    <style>
      .art-study {
        width: min(1440px, 100%);
        margin: auto;
        padding: 24px;
      }
      .art-study h1 {
        font-size: 26px;
        margin-bottom: 12px;
      }
      .art-study h2 {
        margin: 28px 0 12px;
        font-size: 20px;
      }
      .art-study p {
        line-height: 1.7;
        color: #5b6c65;
      }
      .art-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 12px;
      }
      #terrain-gallery {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      #bridge-gallery,
      #vehicle-gallery {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .art-card {
        margin: 0;
        padding: 12px;
        background: #f4f3e7;
        border: 1px solid #d5ddcc;
        border-radius: 12px;
      }
      .art-preview {
        width: 100%;
        height: 180px;
      }
      .art-preview > svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .art-card figcaption {
        text-align: center;
        color: #4c6158;
        font-size: 14px;
        line-height: 1.5;
      }
      .art-study a {
        color: #367b91;
      }
      @media (max-width: 800px) {
        #terrain-gallery,
        #bridge-gallery,
        #vehicle-gallery {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main class="art-study">
      <h1>斜视素材检查</h1>
      <p>
        建筑、道路和车辆共用固定视角与光照。此页只展示素材，不读写地图库。<a
          href="../../"
          >返回游戏</a
        >
      </p>
      <h2>草坪、水体与过街信号灯</h2>
      <p>
        草坪略高，水面略低；相邻同类地形连续拼接。两端灯头相向，面向过街行人，背向镜头时显示灯壳。
      </p>
      <div id="terrain-gallery" class="art-grid"></div>
      <h2>建筑与连续山脉</h2>
      <div id="scenery-gallery" class="art-grid"></div>
      <h2>人物与动物</h2>
      <div id="actor-gallery" class="art-grid"></div>
      <h2>16 种桥面连接</h2>
      <p>
        开口沿共享通行边相接，封闭边设置栏杆；车辆位于前后栏杆之间。N/E/S/W
        表示地图方向。
      </p>
      <div id="bridge-gallery" class="art-grid"></div>
      <h2>四向上下桥</h2>
      <div id="ramp-gallery" class="art-grid"></div>
      <h2>车辆四向</h2>
      <div id="vehicle-gallery" class="art-grid"></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
