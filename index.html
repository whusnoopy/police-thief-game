<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>警察抓小偷 - 趣味棋盘游戏</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🚓 警察抓小偷 🏃</h1>
            <div id="mode-indicator" class="badge">地图编辑模式</div>
        </header>

        <main id="editor-view" class="view active">
            <div class="palette-panel">
                <h3>地块选择</h3>
                <div id="palette" class="palette">
                    <!-- 生成的地块选项会放在这里 -->
                </div>
                <div class="editor-actions">
                    <button id="btn-clear-map" class="btn danger">🗑️ 清空地图</button>
                    <button id="btn-save-map" class="btn primary">💾 保存地图</button>
                    <button id="btn-start-game" class="btn success tooltip" data-tooltip="需放置一个警察出生点和一名小偷出生点">🚀 开始游戏</button>
                </div>
                <p class="help-text">点击上方地块类型，然后在右侧地图上涂抹即可编辑。必须包含一个警察出生点和一个小偷出生点才能开始游戏。</p>
            </div>
            
            <div class="board-container">
                <div id="editor-board" class="board grid-10x10">
                    <!-- 通过 JS 渲染 -->
                </div>
            </div>
        </main>

        <main id="game-view" class="view hidden">
            <div class="game-sidebar">
                <div class="status-panel">
                    <h3 id="turn-indicator">🏃 小偷回合</h3>
                    <div class="player-stats">
                        <div class="stat-box" id="police-stat">
                            <span class="icon">🚓</span>
                            <span class="label">警察</span>
                        </div>
                        <div class="stat-box active" id="thief-stat">
                            <span class="icon">🏃</span>
                            <span class="label">小偷</span>
                        </div>
                    </div>
                </div>

                <div class="dice-panel">
                    <h3>获取步数</h3>
                    <div id="dice" class="dice">🎲</div>
                    <div class="dice-result">
                        <span>步数: </span>
                        <span id="dice-value">?</span>
                    </div>
                    <p id="game-message" class="game-message">点击骰子投掷</p>
                    <button id="btn-roll-dice" class="btn primary">🎲 掷骰子</button>
                    <button id="btn-skip-turn" class="btn warning hidden">⏭️ 跳过回合</button>
                </div>

                <div class="game-actions">
                    <button id="btn-back-editor" class="btn secondary">⬅️ 返回编辑</button>
                </div>
                <div class="legend">
                    <p><span class="emoji">🌿</span> 草地消耗 2 步</p>
                    <p><span class="emoji">⬜</span> 道路消耗 1 步</p>
                </div>
            </div>

            <div class="board-container">
                <div id="game-board" class="board grid-10x10">
                    <!-- 游戏棋盘通过 JS 渲染 -->
                </div>
            </div>
        </main>
        
        <!-- 胜利弹窗 -->
        <div id="victory-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="victory-title">胜利！</h2>
                <p id="victory-message">游戏结束！</p>
                <div class="modal-actions">
                    <button id="btn-play-again" class="btn primary">再玩一次</button>
                    <button id="btn-modal-editor" class="btn secondary">编辑地图</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
